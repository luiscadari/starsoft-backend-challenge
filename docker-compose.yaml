# Use postgres/example user/password credentials

services:
  db:
    image: postgres
    container_name: postgres_db
    ports:
      - 5432:5432
    restart: always
    # set shared memory limit when using docker compose
    networks:
      - app-network
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
      POSTGRES_DB: cinema
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    restart: always
    networks:
      - app-network
  api:
    image: node:latest
    container_name: cinema_api
    restart: always
    networks:
      - app-network
    working_dir: /home/node/app
    environment:
      # Application
      - NODE_ENV=development
      - PORT=3000

      # Database
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_DATABASE=cinema
      - DB_LOGGING=false

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/home/node/app
    ports:
      - 3000:3000
    command: sh -c "npm install && npm run build && npm run start"
    depends_on:
      - db
      - redis
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
